[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alt-data-sector-signal-lab"
version = "0.1.0"
description = "Offline synthetic industrial KPI extraction, signal research and attribution"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.2"]

[tool.setuptools.packages.find]
where = ["python"]
